<div class="py-8 row">
  <div class="col-sm-1">
    <img alt="{{ doc.name }}" src="{{ doc.image }}" class="img-fluid"/>
  </div>
  <div class="col">
    <a class="font-size-lg" href="/{{ doc.route }}">{{ doc.title or doc.article_name or doc.name }}</a>
    <p class="text-muted">By {{ doc.author }}</p>
  </div>
</div>
